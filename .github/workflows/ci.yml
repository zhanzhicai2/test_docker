name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]  # 匹配类似 v1.0.0 的标签
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 更新到v4

    - name: Log in to Alibaba Cloud ACR
      uses: docker/login-action@v3  # 更新到v3
      with:
        registry: crpi-k1l4xuewozf56i16.cn-shenzhen.personal.cr.aliyuncs.com  # 指定ACR注册表地址
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 🏷️ 核心步骤：自动生成多种标签
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5  # 使用元数据Action
      with:
        images: crpi-k1l4xuewozf56i16.cn-shenzhen.personal.cr.aliyuncs.com/${{ secrets.ACR_REPOSITORY }}/test_docker
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}  # 默认分支推送时打上latest
          type=ref,event=tag                                 # 标签触发时，使用标签名（如v1.0.0）
          type=sha,enable=true,prefix=,format=short                        # 始终包含Git commit SHA

    - name: Build and push Docker image
      uses: docker/build-push-action@v5  # 使用Buildx，支持多平台构建
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}  # 使用上一步生成的所有标签
        labels: ${{ steps.meta.outputs.labels }}

  deploy-to-ecs:
      needs: build # 修改为正确的任务名称
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to ECS via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.ECS_HOST }}       # ECS公网IP
            username: ${{ secrets.ECS_USER }}   # 登录用户，如 root 或 ecs-user
            key: ${{ secrets.ECS_SSH_KEY }}     # 用于SSH认证的私钥
            script: |
              cd /home/admin/fastapi-app # 进入您存放 docker-compose.yml 的目录
              docker compose pull  crpi-k1l4xuewozf56i16.cn-shenzhen.personal.cr.aliyuncs.com/${{ secrets.ACR_REPOSITORY }}/test_docker:latest    # 拉取服务的最新镜像
              docker compose up -d     # 重新创建并启动容器
              docker image prune -f    # [可选] 清理旧的镜像，释放磁盘空间

