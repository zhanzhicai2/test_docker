<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI App修改正改版</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Welcome to FastAPI App修改正改版git提交自动执行测试</h1>
        <form id="itemForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter item name">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" placeholder="Enter item description">
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" class="form-control" id="price" placeholder="Enter item price">
            </div>
            <button type="button" class="btn btn-primary" onclick="createItem()">Create Item</button>
        </form>
        <hr>
        <h2>Items</h2>
        <ul id="itemsList" class="list-group">
        </ul>

        <form id="updateForm" class="mt-4">
            <h3>Update Item</h3>
            <div class="mb-3">
                <label for="updateId" class="form-label">Item ID</label>
                <input type="number" class="form-control" id="updateId" placeholder="Enter item ID">
            </div>
            <div class="mb-3">
                <label for="updateName" class="form-label">Name</label>
                <input type="text" class="form-control" id="updateName" placeholder="Enter new item name">
            </div>
            <div class="mb-3">
                <label for="updateDescription" class="form-label">Description</label>
                <input type="text" class="form-control" id="updateDescription" placeholder="Enter new item description">
            </div>
            <div class="mb-3">
                <label for="updatePrice" class="form-label">Price</label>
                <input type="number" class="form-control" id="updatePrice" placeholder="Enter new item price">
            </div>
            <button type="button" class="btn btn-warning" onclick="updateItem()">Update Item</button>
        </form>
    </div>

    <script>
        async function createItem() {
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;
            const price = document.getElementById('price').value;

            const response = await fetch('/items/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, description, price: parseInt(price) }),
            });

            if (response.ok) {
                alert('Item created successfully!');
                loadItems();
            } else {
                alert('Failed to create item.');
            }
        }

        async function loadItems() {
            const response = await fetch('/items/');
            const items = await response.json();

            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.textContent = `${item.id}: ${item.name} - ${item.description} - $${item.price}`;
                itemsList.appendChild(li);
            });
        }

        async function updateItem() {
            const id = document.getElementById('updateId').value;
            const name = document.getElementById('updateName').value;
            const description = document.getElementById('updateDescription').value;
            const price = document.getElementById('updatePrice').value;

            const response = await fetch(`/items/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, description, price: parseInt(price) }),
            });

            if (response.ok) {
                alert('Item updated successfully!');
                loadItems();
            } else {
                alert('Failed to update item.');
            }
        }

        loadItems();
    </script>
</body>
</html>
