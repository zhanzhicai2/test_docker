version: '3.8'

services:
  web:
    build: .
    image: zhanzhicai/github_docker:8a7d421
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_HOST=mysql
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: test_aliyun
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

  # 添加apache_volume:和nginx_volume:如果需要持久化这些服务的数据

version: '3.8'

services:
  # Nginx反向代理服务
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    restart: always

  # Apache静态资源服务器
  apache:
    image: httpd:alpine
    container_name: apache_static
    ports:
      - "8080:80"
    volumes:
      - ./apache/htdocs:/usr/local/apache2/htdocs
      - ./apache/conf/httpd.conf:/usr/local/apache2/conf/httpd.conf
    restart: always

  # FastAPI应用服务
  web:
    image: crpi-k1l4xuewozf56i16.cn-shenzhen.personal.cr.aliyuncs.com/zhanzhicai/test_docker:${IMAGE_TAG}
    pull_policy: always
    container_name: test_docker
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_HOST=mysql_db
      - IMAGE_TAG=${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # MySQL数据库服务
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: test_aliyun
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  db_data:
