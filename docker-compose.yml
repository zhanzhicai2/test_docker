services:
  web:
    image: crpi-k1l4xuewozf56i16.cn-shenzhen.personal.cr.aliyuncs.com/zhanzhicai/test_docker:${IMAGE_TAG}
    pull_policy: always
    container_name: test_docker
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_HOST=mysql_db
      - IMAGE_TAG=${IMAGE_TAG}  # 添加这一行，确保环境变量传递到容器中
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: test_aliyun
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: